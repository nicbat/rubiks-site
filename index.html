<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <meta name="theme-color" content="#f4f7fa" />
    <script>
      // Set the theme before the first paint, including when storage is blocked.
      (() => {
        let theme = "system";
        try {
          theme = localStorage.getItem("last-layer-theme") || "system";
        } catch {}
        const dark =
          theme === "dark" ||
          (theme !== "light" &&
            matchMedia("(prefers-color-scheme: dark)").matches);
        document.documentElement.dataset.theme = dark ? "dark" : "light";
        document.querySelector('meta[name="theme-color"]').content = dark
          ? "#111b25"
          : "#f4f7fa";
      })();
    </script>
    <meta
      name="description"
      content="OLL and PLL algorithms, move notation, a solve timer, and local practice history."
    />
    <title>Last Layer — CFOP practice</title>
    <link rel="icon" href="./favicon.svg" type="image/svg+xml" />
  </head>
  <body>
    <div id="app"></div>
    <script type="module" src="/src/main.js"></script>
  </body>
</html>
