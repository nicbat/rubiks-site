name: Check app
on:
  push:
    branches: [main]
  pull_request:
  schedule:
    - cron: "23 10 * * *"
  workflow_dispatch:
permissions:
  contents: read
jobs:
  check:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 24
          cache: npm
      - run: npm ci
      - run: npx playwright install --with-deps chromium firefox
      - name: PR and main checks
        if: github.event_name != 'schedule' && github.event_name != 'workflow_dispatch'
        run: npm run verify:pr
      - name: Full browser matrix
        if: github.event_name == 'schedule' || github.event_name == 'workflow_dispatch'
        run: npm run verify
      - uses: actions/upload-artifact@v4
        if: failure()
        with:
          name: playwright-failures
          path: |
            playwright-report/
            test-results/
          retention-days: 7
  integration:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 24
          cache: npm
      - run: npm ci
      - run: npx playwright install --with-deps chromium
      - run: npm run test:integration:e2e
      - uses: actions/upload-artifact@v4
        if: failure()
        with:
          name: integration-browser-failures
          path: |
            playwright-report/integration/
            test-results/integration/
          retention-days: 7
